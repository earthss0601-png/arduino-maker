<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아두이노 메이커 프로젝트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 상단 고정 탭 바 + 한 탭씩 보이는 작업 카드. 회로도는 고정된 밝은 '작업 매트' 위에 그린 그림으로 취급 */
:root {
  --bg: #eef2ec;
  --surface: #ffffff;
  --surface-2: #f6f8f4;
  --ink: #16241d;
  --muted: #56675e;
  --line: #d6dfd4;
  --accent: #0b7a55;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe5;
  --solder: #c98a0c;
  --solder-soft: #fbefd2;
  --warn: #b4232c;
  --warn-soft: #fbe3e4;
  --code-bg: #10201a;
  --code-ink: #dbe9e1;
  --font-display: "Do Hyeon", "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "D2Coding", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1612; --surface: #16211c; --surface-2: #1b2822; --ink: #e4eee8; --muted: #9bb0a4;
    --line: #2a3a33; --accent: #3cc493; --accent-ink: #062016; --accent-soft: #173a2d;
    --solder: #f0b63c; --solder-soft: #3a2f14; --warn: #ff7b82; --warn-soft: #3d1b1e;
    --code-bg: #0a120e; --code-ink: #d6e6dd; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1612; --surface: #16211c; --surface-2: #1b2822; --ink: #e4eee8; --muted: #9bb0a4;
  --line: #2a3a33; --accent: #3cc493; --accent-ink: #062016; --accent-soft: #173a2d;
  --solder: #f0b63c; --solder-soft: #3a2f14; --warn: #ff7b82; --warn-soft: #3d1b1e;
  --code-bg: #0a120e; --code-ink: #d6e6dd; color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.65;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 22px 6px; display: flex; flex-wrap: wrap; align-items: end; gap: 6px 18px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 5vw, 40px); line-height: 1.15; margin: 0; letter-spacing: -0.5px; }
h1 .chip-mark { color: var(--accent); }
header.top p { margin: 0 0 6px; color: var(--muted); font-size: 14px; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; padding-block: 8px; }
.tab {
  flex: 0 0 auto; border: 1px solid transparent; background: transparent; color: var(--muted);
  font: 500 14px/1 var(--font-body); padding: 9px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  display: inline-flex; gap: 6px; align-items: center;
}
.tab .num { font-family: var(--font-mono); font-size: 12px; color: var(--solder); }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab[aria-selected="true"] .num { color: var(--accent-ink); opacity: .75; }
.tab:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--solder); outline-offset: 2px; }

main .wrap { padding-block: 28px 64px; display: grid; gap: 28px; }
section.block { display: grid; gap: 12px; min-width: 0; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { font-size: 17px; margin: 0; }
.eyebrow { font: 600 12px/1 var(--font-mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--solder); }
p { margin: 0; }
.muted { color: var(--muted); }

.hero { display: grid; gap: 10px; }
.hero h2 { font-size: clamp(30px, 5vw, 44px); }
.hero .pitch { font-size: 18px; max-width: 62ch; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; background: var(--surface); border: 1px solid var(--line); }
.pill b { font-weight: 700; }
.pill.lv { background: var(--solder-soft); border-color: transparent; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; min-width: 0; display: grid; gap: 10px; align-content: start; }
ul.parts, ol.steps, ul.ideas { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
ul.parts li::marker { color: var(--accent); }
ol.steps li::marker { color: var(--solder); font-weight: 700; }

.diagram-box { background: #eef2ec; border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
.diagram-box svg { display: block; width: 100%; min-width: 820px; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 6px; border-radius: 3px; display: inline-block; }

.check-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.progress { font: 600 14px var(--font-mono); color: var(--accent); }
.btn { font: 500 14px var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table.wires { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 520px; }
table.wires th, table.wires td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.wires th { font-size: 12px; letter-spacing: 1px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
table.wires tr:last-child td { border-bottom: 0; }
table.wires td.n { font-family: var(--font-mono); color: var(--muted); width: 2.5em; font-variant-numeric: tabular-nums; }
table.wires tr.done td { color: var(--muted); }
table.wires tr.done td.what { text-decoration: line-through; }
table.wires input { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
.wirecell { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.wirecell .sw { width: 26px; height: 8px; }
.to { font-weight: 700; }
.res { display: inline-block; margin-left: 6px; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--solder-soft); color: var(--ink); white-space: nowrap; }

.code-wrap { position: relative; border-radius: 12px; background: var(--code-bg); overflow: hidden; }
.code-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.08); color: var(--code-ink); font: 13px var(--font-mono); }
.code-bar .btn { background: transparent; color: var(--code-ink); border-color: rgba(255,255,255,.2); }
.code-bar .btn.ok { border-color: #3cc493; color: #3cc493; }
pre.code { margin: 0; padding: 16px 18px; overflow-x: auto; font: 13.5px/1.6 var(--font-mono); color: var(--code-ink); tab-size: 2; font-variant-ligatures: none; }
.tk-c { color: #7f9a8c; font-style: italic; }
.tk-s { color: #f2c46d; }
.tk-p { color: #ff9b85; }
.tk-n { color: #8fd3ff; }
.tk-k { color: #6fe0b2; font-weight: 600; }
.tk-f { color: #c9a8ff; }

.callout { border-radius: 10px; padding: 12px 14px; background: var(--solder-soft); font-size: 15px; }
.callout.warn { background: var(--warn-soft); }
.callout b { font-weight: 700; }
.libs { display: grid; gap: 6px; }
.lib { font-size: 14px; }
.lib code, p code, li code { font-family: var(--font-mono); font-size: .9em; background: var(--surface-2); border: 1px solid var(--line); padding: 0 5px; border-radius: 5px; }

/* 안내 탭 */
.timeline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .timeline { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .timeline { grid-template-columns: 1fr; } }
.slot { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.slot .hour { font: 600 13px var(--font-mono); color: var(--solder); }
.slot h3 { font-family: var(--font-display); font-weight: 400; font-size: 21px; }
.slot p { font-size: 14px; color: var(--muted); }

.mixer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 14px; }
.mix-row { display: grid; gap: 8px; }
.mix-row .lab { font-weight: 700; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 500 14px var(--font-body); cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mix-out { border-top: 1px dashed var(--line); padding-top: 14px; display: grid; gap: 8px; }
.mix-out .idea { font-family: var(--font-display); font-size: 24px; line-height: 1.3; }
.mix-out .refs { display: flex; flex-wrap: wrap; gap: 6px; }
.linkbtn { border: 0; background: var(--accent-soft); color: var(--ink); font: 500 14px var(--font-body); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.linkbtn:hover { background: var(--accent); color: var(--accent-ink); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; color: var(--ink); font: inherit; }
.card:hover { border-color: var(--accent); }
.card .t { font-family: var(--font-display); font-size: 21px; line-height: 1.25; }
.card .s { font-size: 13px; color: var(--muted); }
.card .n { font: 600 12px var(--font-mono); color: var(--solder); }

.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
footer { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: no-preference) { .tab, .chip, .card, .btn { transition: background .15s, border-color .15s, color .15s; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>아두이노 <span class="chip-mark">메이커</span> 프로젝트</h1>
    <p>58종 키트로 만드는 나만의 발명품 · 예시를 보고 꽂고, 올리고, 내 아이디어로 바꿔 보세요</p>
  </div>
</header>
<nav class="tabs" aria-label="프로젝트 탭">
  <div class="wrap" role="tablist" id="tablist"></div>
</nav>
<main>
  <div class="wrap" id="view"></div>
</main>

<script>
/* ───────────── 프로젝트 데이터 ─────────────
   pins: [핀 이름, 연결할 곳, 옵션]
   연결할 곳: '+' 브레드보드 + 줄, '-' 브레드보드 − 줄, 'D2'~'D13', 'A0'~'A5', '5V', '3.3V', 'GND', null(연결 안 함)
   옵션: { r: '220Ω' } 저항을 거쳐 연결 */
const PROJECTS = [
{
  id: 'parking', title: '스마트 주차 경보기', level: 1, time: '40분',
  pitch: '벽에 가까워질수록 “삐-삐-” 소리가 빨라지고, 초록 → 노랑 → 빨강 불이 켜지는 자동차 후방 센서예요.',
  how: ['초음파 센서가 소리를 쏘고 돌아오는 시간으로 거리를 재요.', '30cm 이상이면 초록, 10~30cm면 노랑, 10cm보다 가까우면 빨강 LED를 켜요.', '가까울수록 부저 소리 사이 간격을 짧게 해요.'],
  in: ['거리'], out: ['LED', '부저'], libs: [],
  comps: [
    { key: 'us', name: '초음파 센서', sub: 'HC-SR04', type: 'ultrasonic', pins: [['VCC', '+'], ['Trig', 'D9'], ['Echo', 'D8'], ['GND', '-']] },
    { key: 'bz', name: '피에조 부저', sub: '', type: 'buzzer', pins: [['+ (긴 다리)', 'D5'], ['− (짧은 다리)', '-']] },
    { key: 'led', name: 'LED 3개', sub: '초록·노랑·빨강', type: 'leds', colors: ['#2fbf5b', '#f5c400', '#e53935'], pins: [['초록 LED 긴 다리', 'D2', { r: '220Ω' }], ['노랑 LED 긴 다리', 'D3', { r: '220Ω' }], ['빨강 LED 긴 다리', 'D4', { r: '220Ω' }], ['짧은 다리 3개 모두', '-']] }
  ],
  code: `// 스마트 주차 경보기 : 가까워질수록 삐-삐- 소리가 빨라져요
const int TRIG = 9;     // 초음파 Trig
const int ECHO = 8;     // 초음파 Echo
const int BUZZ = 5;     // 부저
const int LED_G = 2;    // 초록 LED (안전)
const int LED_Y = 3;    // 노랑 LED (주의)
const int LED_R = 4;    // 빨강 LED (위험)

void setup() {
  pinMode(TRIG, OUTPUT);
  pinMode(ECHO, INPUT);
  pinMode(BUZZ, OUTPUT);
  pinMode(LED_G, OUTPUT);
  pinMode(LED_Y, OUTPUT);
  pinMode(LED_R, OUTPUT);
  Serial.begin(9600);
}

// 거리(cm)를 재는 함수
long readCM() {
  digitalWrite(TRIG, LOW);
  delayMicroseconds(2);
  digitalWrite(TRIG, HIGH);
  delayMicroseconds(10);
  digitalWrite(TRIG, LOW);
  long t = pulseIn(ECHO, HIGH, 30000);  // 초음파가 돌아오는 데 걸린 시간
  if (t == 0) return 999;               // 너무 멀면 999
  return t * 0.034 / 2;
}

void loop() {
  long d = readCM();
  Serial.print("거리: ");
  Serial.print(d);
  Serial.println(" cm");

  digitalWrite(LED_G, d >= 30);
  digitalWrite(LED_Y, d >= 10 && d < 30);
  digitalWrite(LED_R, d < 10);

  if (d < 10) {            // 아주 가까움 : 계속 삐-
    tone(BUZZ, 1000);
    delay(100);
  } else if (d < 30) {     // 가까움 : 거리만큼 쉬었다가 삐
    tone(BUZZ, 1000, 80);
    delay(d * 15);
  } else {                 // 멀다 : 조용히
    noTone(BUZZ);
    delay(200);
  }
}`,
  try: ['툴 → 시리얼 모니터(9600)를 열고 손을 앞뒤로 움직이며 거리 숫자를 확인해요.', '손을 천천히 가까이 가져가며 LED 색과 소리 간격이 바뀌는지 봐요.'],
  ext: ['기준 거리(30, 10)를 바꿔 자전거용·로봇 청소기용 센서로 만들기', '서보모터를 더해 너무 가까우면 “차단기”가 내려오게 하기', 'LCD를 더해 거리 숫자를 화면에 보여 주기']
},
{
  id: 'weather', title: '나만의 기상 스테이션', level: 2, time: '50분',
  pitch: '교실의 온도·습도·밝기를 재서 LCD 화면에 보여 주는 미니 날씨 관측소예요.',
  how: ['DHT11 센서로 온도(℃)와 습도(%)를 읽어요.', '조도 센서(CDS)로 밝기를 0~1023 숫자로 읽어요.', '2초마다 LCD 첫 줄에 온·습도, 둘째 줄에 밝기를 보여 줘요.'],
  in: ['온습도', '빛'], out: ['LCD'],
  libs: [['DHT sensor library', 'Adafruit 제작 · 설치할 때 함께 설치하라고 나오는 것도 모두 설치'], ['LiquidCrystal I2C', 'Frank de Brabander 제작']],
  comps: [
    { key: 'dht', name: '온습도 센서', sub: 'DHT11', type: 'dht', pins: [['VCC (+)', '+'], ['DATA (S)', 'D2'], ['GND (−)', '-']] },
    { key: 'cds', name: '조도 센서 + 10kΩ 저항', sub: 'CDS', type: 'cds', pins: [['CDS 다리 ①', '+'], ['CDS 다리 ② + 저항 한쪽', 'A0'], ['10kΩ 저항 다른 쪽', '-']] },
    { key: 'lcd', name: 'I2C LCD', sub: '16×2', type: 'lcd', text: ['T:24.5C H:40%', 'Light:612 SUN'], pins: [['GND', '-'], ['VCC', '+'], ['SDA', 'A4'], ['SCL', 'A5']] }
  ],
  note: '조도 센서가 3핀 모듈(VCC·GND·S 또는 AO)이라면 저항 없이 S(AO)→A0, VCC→+줄, GND→−줄로 연결해요.',
  code: `// 나만의 기상 스테이션 : 온도, 습도, 밝기를 LCD에 표시해요
#include <DHT.h>
#include <Wire.h>
#include <LiquidCrystal_I2C.h>

DHT dht(2, DHT11);                    // DHT11 센서는 2번 핀
LiquidCrystal_I2C lcd(0x27, 16, 2);   // 글자가 안 나오면 0x27 → 0x3F 로 바꿔 보기
const int LIGHT = A0;                 // 조도 센서

void setup() {
  dht.begin();
  lcd.init();
  lcd.backlight();
  Serial.begin(9600);
  lcd.print("Weather Station");
  delay(1500);
}

void loop() {
  float t = dht.readTemperature();    // 온도 (℃)
  float h = dht.readHumidity();       // 습도 (%)
  int light = analogRead(LIGHT);      // 밝기 0 ~ 1023

  lcd.clear();
  if (isnan(t) || isnan(h)) {         // 센서를 못 읽었을 때
    lcd.print("Sensor Error!");
    delay(2000);
    return;
  }

  lcd.setCursor(0, 0);
  lcd.print("T:");
  lcd.print(t, 1);
  lcd.print("C H:");
  lcd.print(h, 0);
  lcd.print("%");

  lcd.setCursor(0, 1);
  lcd.print("Light:");
  lcd.print(light);
  if (light > 500) lcd.print(" SUN");   // 기준값 500은 바꿔도 돼요
  else             lcd.print(" DARK");

  Serial.print("온도 "); Serial.print(t);
  Serial.print(" / 습도 "); Serial.print(h);
  Serial.print(" / 밝기 "); Serial.println(light);
  delay(2000);

const BOT_LABEL = ['', 'IOREF', 'RESET', '3.3V', '5V', 'GND', 'GND', 'VIN', 'A0', 'A1', 'A2', 'A3', 'A4', 'A5'];

const PALETTE = [['#f2b705', '노랑'], ['#26a65b', '초록'], ['#1f6fe0', '파랑'], ['#f07818', '주황'], ['#8e44ad', '보라'], ['#14a3a8', '청록'], ['#d6336c', '분홍'], ['#8a5a2b', '갈색'], ['#6b7b88', '회색']];
const RED = ['#d93636', '빨강'], BLACK = ['#2a2a2a', '검정'];

function pinPos(name, by) {
  if (name === 'GND') name = 'GND';
  let i = TOP_PINS.indexOf(name);
  if (i >= 0) return { x: BX + (i < 10 ? 120 + i * 16 : 290 + (i - 10) * 16), y: by + 16, side: 'top' };
  i = BOT_PINS.indexOf(name);
  if (i >= 0) return { x: BX + (i < 8 ? 140 + i * 16 : 284 + (i - 8) * 16), y: by + BH - 16, side: 'bottom' };
  return null;
}

function targetText(t) {
  if (t === '+') return '브레드보드 + 줄';
  if (t === '-') return '브레드보드 − 줄';
  if (/^D\d+$/.test(t)) return '디지털 ' + t.slice(1) + '번';
  if (/^A\d$/.test(t)) return '아날로그 ' + t;
  return t;
}
function shortTarget(t) { return t === '+' ? '+줄' : t === '-' ? '−줄' : /^D\d+$/.test(t) ? t.slice(1) + '번' : t; }

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function buildWiring(p) {
  // 부품 위치
  let cy = 16;
  const comps = p.comps.map(c => {
    const h = Math.max(100, 44 + c.pins.length * 26);
    const o = { ...c, y: cy, h, pinY: c.pins.map((_, i) => cy + 42 + i * 26) };
    cy += h + 18;
    return o;
  });
  const compBottom = cy;

  // 선 목록
  let pi = 0;
  const wires = [];
  comps.forEach(c => c.pins.forEach((pin, i) => {
    const [label, to, opt] = pin;
    if (!to) return;
    let col;
    if (to === '+' || to === '5V' || to === '3.3V') col = RED;
    else if (to === '-' || to === 'GND') col = BLACK;
    else col = PALETTE[pi++ % PALETTE.length];
    wires.push({ comp: c, label, to, r: opt && opt.r, color: col, endY: c.pinY[i] });
  }));
  const usesRail = wires.some(w => w.to === '+' || w.to === '-');
  return { comps, wires, usesRail, compBottom };
}

  <text x="${vert ? mx + 12 : mx}" y="${vert ? my + 4 : my - 11}" font-size="11" font-weight="700" fill="#5a4521" text-anchor="${vert ? 'start' : 'middle'}" paint-order="stroke" stroke="#eef2ec" stroke-width="3">${value}</text>`;
}

function iconSVG(c, x, y) {
  const t = c.type;
  if (t === 'ultrasonic') return `<rect x="${x - 50}" y="${y - 24}" width="100" height="48" rx="4" fill="#2f6fb5"/>
    ${[-25, 25].map(d => `<circle cx="${x + d}" cy="${y}" r="17" fill="#d4dadf" stroke="#8a949c" stroke-width="2"/><circle cx="${x + d}" cy="${y}" r="10" fill="#4d565e"/>`).join('')}`;
  if (t === 'leds' || t === 'rgb') {
    const cols = t === 'rgb' ? ['url(#rgbgrad)'] : c.colors;
    const gap = 30, start = x - (cols.length - 1) * gap / 2;
    return cols.map((col, i) => {
      const lx = start + i * gap;
      const legs = t === 'rgb' ? [-6, -2, 2, 6].map((d, k) => `<line x1="${lx + d}" y1="${y + 12}" x2="${lx + d}" y2="${y + (k === 1 ? 34 : 28)}" stroke="#9aa3a8" stroke-width="2"/>`).join('')
        : `<line x1="${lx - 4}" y1="${y + 12}" x2="${lx - 4}" y2="${y + 34}" stroke="#9aa3a8" stroke-width="2"/><line x1="${lx + 4}" y1="${y + 12}" x2="${lx + 4}" y2="${y + 28}" stroke="#9aa3a8" stroke-width="2"/>`;
      return `${legs}<path d="M${lx - 10} ${y + 12} v-14 a10 10 0 0 1 20 0 v14 z" fill="${col}" stroke="rgba(0,0,0,.25)"/><rect x="${lx - 12}" y="${y + 9}" width="24" height="4" rx="1" fill="${col}" opacity=".85"/>
        <path d="M${lx - 5} ${y - 6} a5 5 0 0 1 5 -5" stroke="#fff" stroke-width="2" fill="none" opacity=".7"/>`;
    }).join('');
  }
  if (t === 'buzzer') return `<circle cx="${x}" cy="${y}" r="24" fill="#1f1f1f"/><circle cx="${x}" cy="${y}" r="5" fill="#555"/><text x="${x - 13}" y="${y - 9}" font-size="12" fill="#fff" font-weight="700">+</text>`;
  if (t === 'servo') return `<rect x="${x - 40}" y="${y - 16}" width="80" height="34" rx="3" fill="#2a5db0"/><rect x="${x - 50}" y="${y - 8}" width="100" height="6" rx="2" fill="#2a5db0"/>
    <circle cx="${x - 18}" cy="${y - 16}" r="10" fill="#e9eef3"/><rect x="${x - 22}" y="${y - 34}" width="8" height="34" rx="4" fill="#f5f7f9" stroke="#b9c2ca"/><circle cx="${x - 18}" cy="${y - 16}" r="3" fill="#888"/>
    <text x="${x + 12}" y="${y + 6}" font-size="10" fill="#fff" text-anchor="middle">SG90</text>`;
  if (t === 'lcd') {
    const tx = c.text || ['HELLO', ''];
    return `<rect x="${x - 56}" y="${y - 28}" width="112" height="56" rx="4" fill="#1f7a3b"/><rect x="${x - 50}" y="${y - 20}" width="100" height="40" rx="2" fill="#2f6be0"/>
      <text x="${x - 46}" y="${y - 4}" font-family="monospace" font-size="9.5" fill="#fff">${esc(tx[0])}</text><text x="${x - 46}" y="${y + 12}" font-family="monospace" font-size="9.5" fill="#fff">${esc(tx[1])}</text>`;
  }
  if (t === 'dht') return `<rect x="${x - 20}" y="${y - 28}" width="40" height="52" rx="4" fill="#3d8fe0"/>
    ${[0, 1, 2, 3, 4].map(r => [0, 1, 2].map(k => `<rect x="${x - 13 + k * 9}" y="${y - 22 + r * 9}" width="6" height="5" rx="1" fill="#1d5fa3"/>`).join('')).join('')}`;
  if (t === 'cds') return `<circle cx="${x - 16}" cy="${y - 6}" r="15" fill="#f1e4c3" stroke="#b39a68" stroke-width="2"/>
    <path d="M${x - 26} ${y - 10} h6 v8 h6 v-8 h6 v8 h6" stroke="#a6452b" stroke-width="2" fill="none"/>
    <line x1="${x - 20}" y1="${y + 9}" x2="${x - 20}" y2="${y + 28}" stroke="#9aa3a8" stroke-width="2"/><line x1="${x - 12}" y1="${y + 9}" x2="${x - 12}" y2="${y + 28}" stroke="#9aa3a8" stroke-width="2"/>
    <g transform="translate(${x + 26} ${y + 4}) rotate(90)"><rect x="-15" y="-6" width="30" height="12" rx="5" fill="#e8d2a2" stroke="#9c8156"/><rect x="-8" y="-6" width="3" height="12" fill="#7a4a1d"/><rect x="-2" y="-6" width="3" height="12" fill="#111"/><rect x="4" y="-6" width="3" height="12" fill="#f07818"/></g>
    <text x="${x + 26}" y="${y - 18}" font-size="10" fill="#5a4521" text-anchor="middle">10kΩ</text>`;
  if (t === 'pot') return `<rect x="${x - 24}" y="${y - 14}" width="48" height="32" rx="3" fill="#2c64c8"/><circle cx="${x}" cy="${y}" r="13" fill="#e3e7ea" stroke="#9aa3a8"/><line x1="${x}" y1="${y}" x2="${x + 7}" y2="${y - 9}" stroke="#333" stroke-width="3" stroke-linecap="round"/>`;
  if (t === 'buttons') {
    const cols = c.colors, gap = 28, start = x - (cols.length - 1) * gap / 2;
    return cols.map((col, i) => `<rect x="${start + i * gap - 12}" y="${y - 12}" width="24" height="24" rx="3" fill="#2b2b2b"/><circle cx="${start + i * gap}" cy="${y}" r="8" fill="${col}"/>`).join('');
  }
  if (t === 'keypad') {
    const keys = ['1', '2', '3', 'A', '4', '5', '6', 'B', '7', '8', '9', 'C', '*', '0', '#', 'D'];
    return `<rect x="${x - 44}" y="${y - 54}" width="88" height="98" rx="5" fill="#1e1e1e"/>` + keys.map((k, i) => {
      const kx = x - 38 + (i % 4) * 20, ky = y - 48 + Math.floor(i / 4) * 20;
      return `<rect x="${kx}" y="${ky}" width="16" height="16" rx="3" fill="${/[A-D]/.test(k) ? '#d64545' : '#3a7bd5'}"/><text x="${kx + 8}" y="${ky + 12}" font-size="10" fill="#fff" text-anchor="middle">${esc(k)}</text>`;
    }).join('') + `<rect x="${x - 26}" y="${y + 44}" width="52" height="10" fill="#c7a548"/>`;
  }
  if (t === 'soil') return `<rect x="${x - 30}" y="${y - 30}" width="60" height="20" rx="3" fill="#2a8f4a"/>
    <path d="M${x - 22} ${y - 10} v36 l6 8 l6 -8 v-36 z M${x + 10} ${y - 10} v36 l6 8 l6 -8 v-36 z" fill="#c9a14a" stroke="#8b6d2b"/>`;
  if (t === 'pir') return `<rect x="${x - 30}" y="${y - 26}" width="60" height="52" rx="3" fill="#2a8f4a"/><circle cx="${x}" cy="${y}" r="22" fill="#f4f4f0" stroke="#c9c9c0" stroke-width="2"/>
    <path d="M${x - 22} ${y} h44 M${x} ${y - 22} v44 M${x - 15} ${y - 15} l30 30 M${x + 15} ${y - 15} l-30 30" stroke="#d8d8cf" stroke-width="1.5"/>`;
  if (t === 'ir') return `<rect x="${x - 50}" y="${y - 10}" width="34" height="22" rx="3" fill="#2a8f4a"/><path d="M${x - 42} ${y - 10} v-10 a9 9 0 0 1 18 0 v10 z" fill="#222"/>
    <rect x="${x - 4}" y="${y - 32}" width="40" height="66" rx="8" fill="#2b2b2b"/>
    ${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => `<circle cx="${x + 6 + (i % 3) * 10}" cy="${y - 18 + Math.floor(i / 3) * 12}" r="3.5" fill="#d0d0d0"/>`).join('')}<circle cx="${x + 16}" cy="${y + 22}" r="6" fill="#e04848"/>`;
  if (t === 'joystick') return `<rect x="${x - 30}" y="${y - 30}" width="60" height="60" rx="4" fill="#1f1f1f"/><circle cx="${x}" cy="${y}" r="22" fill="#3a3a3a"/><circle cx="${x}" cy="${y}" r="13" fill="#5a5a5a" stroke="#777"/>`;
  return '';
}

function renderDiagram(p) {
  const { comps, wires, usesRail, compBottom } = buildWiring(p);
  const sig = wires.filter(w => w.to !== '+' && w.to !== '-');
  sig.forEach(w => { w.p = pinPos(w.to, 0); });
  const top = sig.filter(w => w.p.side === 'top').sort((a, b) => a.endY - b.endY);      // [0] = 가장 바깥
  const bot = sig.filter(w => w.p.side === 'bottom').sort((a, b) => a.endY - b.endY);   // [0] = 가장 안쪽
  const by = Math.max(46, 34 + top.length * 11);

  // 세로 통로: 아래쪽 선(왼쪽) → 위쪽 선(오른쪽)
  const vOrder = [...bot, ...top.slice().reverse()];
  const n = vOrder.length;
  const step = n > 1 ? Math.min(13, 90 / (n - 1)) : 0;
  vOrder.forEach((w, j) => { w.lx = 500 + j * step + (n === 1 ? 40 : 0); });

  top.forEach((w, k) => { w.ly = by - 14 - (top.length - 1 - k) * 11; });
  bot.forEach((w, k) => { w.ly = by + BH + 14 + k * 11; });
  const railY0 = by + BH + 14 + bot.length * 11;
  const H = Math.max(compBottom + 6, railY0 + (usesRail ? 2 * 11 : 0) + 22);

  const used = new Set(sig.map(w => w.to));
  if (usesRail) { used.add('5V'); used.add('GND'); }

  let s = `<svg viewBox="0 0 1020 ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(p.title)} 회로 연결도" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif">
  <defs><linearGradient id="rgbgrad" x1="0" x2="1"><stop offset="0" stop-color="#ff5a5a"/><stop offset=".5" stop-color="#5ad06a"/><stop offset="1" stop-color="#5a8cff"/></linearGradient></defs>
  <rect width="1020" height="${H}" fill="#eef2ec"/>`;

  // 브레드보드 전원줄
  if (usesRail) {
    s += `<rect x="600" y="8" width="44" height="${H - 16}" rx="6" fill="#fbfbf7" stroke="#d3d3c8"/>
      <line x1="605" y1="30" x2="605" y2="${H - 14}" stroke="#d93636" stroke-width="2"/><line x1="639" y1="30" x2="639" y2="${H - 14}" stroke="#2f6fe0" stroke-width="2"/>
      <text x="${RAILP}" y="26" font-size="16" font-weight="700" fill="#d93636" text-anchor="middle">+</text><text x="${RAILN}" y="26" font-size="16" font-weight="700" fill="#2f6fe0" text-anchor="middle">−</text>`;
    for (let yy = 40; yy < H - 16; yy += 13) s += `<rect x="${RAILP - 2}" y="${yy}" width="4" height="4" fill="#cfcfc4"/><rect x="${RAILN - 2}" y="${yy}" width="4" height="4" fill="#cfcfc4"/>`;
  }

  // 아두이노 보드
  s += `<rect x="${BX}" y="${by}" width="${BW}" height="${BH}" rx="14" fill="#16708f" stroke="#0e5068" stroke-width="2"/>
    <rect x="${BX - 14}" y="${by + 46}" width="74" height="58" rx="3" fill="#c9ced3" stroke="#8b949b"/><text x="${BX + 23}" y="${by + 80}" font-size="11" fill="#555" text-anchor="middle">USB</text>
    <rect x="${BX - 10}" y="${by + 206}" width="64" height="52" rx="3" fill="#1e1e1e"/>
    <text x="${BX + 70}" y="${by + 172}" font-size="36" font-weight="700" fill="#fff" opacity=".9">UNO</text>
    <rect x="${BX + 200}" y="${by + 130}" width="190" height="44" rx="3" fill="#222"/><text x="${BX + 295}" y="${by + 157}" font-size="12" fill="#bbb" text-anchor="middle">ATmega328P</text>
    <text x="${BX + 300}" y="${by + 86}" font-size="11" font-weight="700" fill="#fff" opacity=".75" text-anchor="middle">DIGITAL (PWM ~)</text>
    <text x="${BX + 196}" y="${by + BH - 84}" font-size="11" font-weight="700" fill="#fff" opacity=".75" text-anchor="middle">POWER</text>
    <text x="${BX + 324}" y="${by + BH - 84}" font-size="11" font-weight="700" fill="#fff" opacity=".75" text-anchor="middle">ANALOG IN</text>`;
  // 헤더
  const header = (x0, count, y) => `<rect x="${x0 - 9}" y="${y - 9}" width="${(count - 1) * 16 + 18}" height="18" rx="2" fill="#1b1b1b"/>`;
  s += header(BX + 120, 10, by + 16) + header(BX + 290, 8, by + 16) + header(BX + 140, 8, by + BH - 16) + header(BX + 284, 6, by + BH - 16);
  TOP_PINS.forEach((nm, i) => {
    const q = pinPos(nm, by), on = used.has(nm) || (nm === 'GND_T' && false);
    s += `<rect x="${q.x - 3}" y="${q.y - 3}" width="6" height="6" fill="#555"/>`;
    s += `<text transform="translate(${q.x + 3.5} ${by + 30}) rotate(-90)" font-size="10" fill="${on ? '#ffd23f' : '#fff'}" font-weight="${on ? 700 : 400}" text-anchor="end">${TOP_LABEL[i]}</text>`;
  });
  BOT_PINS.forEach((nm, i) => {
    const q = pinPos(nm, by), on = used.has(nm);
    s += `<rect x="${q.x - 3}" y="${q.y - 3}" width="6" height="6" fill="#555"/>`;
    if (BOT_LABEL[i]) s += `<text transform="translate(${q.x + 3.5} ${by + BH - 30}) rotate(-90)" font-size="10" fill="${on ? '#ffd23f' : '#fff'}" font-weight="${on ? 700 : 400}" text-anchor="start">${BOT_LABEL[i]}</text>`;
  });

  // 부품 상자
  comps.forEach(c => {
    s += `<rect x="${CX}" y="${c.y}" width="${CW}" height="${c.h}" rx="10" fill="#ffffff" stroke="#c6d0c7"/>
      <text x="${CX + 14}" y="${c.y + 23}" font-size="14" font-weight="700" fill="#1a2620">${esc(c.name)}<tspan font-size="11" font-weight="400" fill="#6a7a70">${c.sub ? '  ' + esc(c.sub) : ''}</tspan></text>`;
    s += iconSVG(c, CX + 242, c.y + Math.max(c.h / 2 + 8, 62));
    c.pins.forEach((pin, i) => {
      const yy = c.pinY[i], to = pin[1];
      s += `<text x="${CX + 14}" y="${yy + 4}" font-size="12" fill="${to ? '#1a2620' : '#9aa59e'}">${esc(pin[0])}<tspan font-weight="700" fill="${to ? '#0b7a55' : '#9aa59e'}">  → ${to ? esc(shortTarget(to)) : '연결 안 함'}</tspan></text>`;
    });
  });

  // 선
  const line = (pts, col) => {
    const d = 'M' + pts.map(q => q.join(' ')).join(' L');
    return `<path d="${d}" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
  };
  const dot = (x, y, col) => `<circle cx="${x}" cy="${y}" r="4.5" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
  let wireSvg = '', overlay = '';

  if (usesRail) {
    const g = pinPos('GND', by), v = pinPos('5V', by);
    const gy = railY0, vy = railY0 + 11;
    wireSvg += line([[v.x, v.y], [v.x, vy], [RAILP, vy]], RED[0]) + dot(v.x, v.y, RED[0]) + dot(RAILP, vy, RED[0]);
    wireSvg += line([[g.x, g.y], [g.x, gy], [RAILN, gy]], BLACK[0]) + dot(g.x, g.y, BLACK[0]) + dot(RAILN, gy, BLACK[0]);
  }
  wires.filter(w => w.to === '+' || w.to === '-').forEach(w => {
    const rx = w.to === '+' ? RAILP : RAILN;
    wireSvg += line([[CX, w.endY], [rx, w.endY]], w.color[0]) + dot(CX, w.endY, w.color[0]) + dot(rx, w.endY, w.color[0]);
  });
  sig.forEach(w => {
    const q = pinPos(w.to, by);
    const pts = [[q.x, q.y], [q.x, w.ly], [w.lx, w.ly], [w.lx, w.endY], [CX, w.endY]];
    wireSvg += line(pts, w.color[0]) + dot(q.x, q.y, w.color[0]) + dot(CX, w.endY, w.color[0]);
    if (w.r) overlay += resistorSVG((644 + CX) / 2, w.endY, w.r);
  });
  // 사용 핀 표시
  used.forEach(nm => { const q = pinPos(nm, by); if (q) s += `<circle cx="${q.x}" cy="${q.y}" r="8" fill="none" stroke="#ffd23f" stroke-width="2.5"/>`; });

  s += wireSvg + overlay + '</svg>';
  return { svg: s, wires, usesRail };
}

/* ───────────── 코드 색칠 ───────────── */
const KW = /^(void|int|long|float|bool|const|char|byte|unsigned|uint8_t|if|else|for|while|return|switch|case|break|true|false|String)$/;
const FN = /^(setup|loop|pinMode|digitalWrite|digitalRead|analogWrite|analogRead|delay|delayMicroseconds|tone|noTone|pulseIn|millis|map|constrain|min|max|random|randomSeed|isnan)$/;
function highlight(code) {
  const re = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(#\w+[^\n]*)|\b(0x[0-9A-Fa-f]+|\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const [tok] = m;
    if (m[1]) out += `<span class="tk-c">${esc(tok)}</span>`;
    else if (m[2]) out += `<span class="tk-s">${esc(tok)}</span>`;
    else if (m[3]) out += `<span class="tk-p">${esc(tok)}</span>`;
    else if (m[4]) out += `<span class="tk-n">${esc(tok)}</span>`;
    else if (KW.test(tok)) out += `<span class="tk-k">${tok}</span>`;
    else if (FN.test(tok) || /^(Serial|lcd|dht|IrReceiver|keypad|lid|lock|turret)$/.test(tok)) out += `<span class="tk-f">${tok}</span>`;
    else out += esc(tok);
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

/* ───────────── 저장 (이 브라우저에만) ───────────── */
function load(key, fb) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }

/* ───────────── 화면 ───────────── */
const view = document.getElementById('view');
const tablist = document.getElementById('tablist');
const TABS = [{ id: 'guide', label: '시작하기', num: '' }, ...PROJECTS.map((p, i) => ({ id: p.id, label: p.title, num: String(i + 1).padStart(2, '0') }))];

tablist.innerHTML = TABS.map(t => `<button class="tab" role="tab" id="tab-${t.id}" data-id="${t.id}" aria-selected="false">${t.num ? `<span class="num">${t.num}</span>` : ''}${esc(t.label)}</button>`).join('');
tablist.addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) go(b.dataset.id); });

function go(id, noScroll) {
  if (!TABS.some(t => t.id === id)) id = 'guide';
  tablist.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.id === id ? 'true' : 'false'));
  const btn = document.getElementById('tab-' + id);
  if (btn) btn.scrollIntoView({ block: 'nearest', inline: 'center' });
  view.innerHTML = id === 'guide' ? guideHTML() : projectHTML(PROJECTS.find(p => p.id === id));
  if (id === 'guide') bindGuide(); else bindProject(PROJECTS.find(p => p.id === id));
  save('am-tab', id);
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  if (!noScroll) window.scrollTo({ top: 0 });
}

function stars(n) { return '★'.repeat(n) + '☆'.repeat(3 - n); }

function projectHTML(p) {
  const idx = PROJECTS.indexOf(p) + 1;
  const d = renderDiagram(p);
  const rows = [];
  if (d.usesRail) {
    rows.push({ what: '아두이노 <b>5V</b>', to: '브레드보드 + 줄', col: RED });
    rows.push({ what: '아두이노 <b>GND</b>', to: '브레드보드 − 줄', col: BLACK });
  }
  // 전원 → 신호 순서로 꽂기
  const ordered = [...d.wires.filter(w => w.to === '+' || w.to === '-'), ...d.wires.filter(w => w.to !== '+' && w.to !== '-')];
  ordered.forEach(w => rows.push({ what: `${esc(w.comp.name)} <b>${esc(w.label)}</b>`, to: targetText(w.to), col: w.color, r: w.r }));
  const allParts = ['아두이노 UNO + USB 케이블', '브레드보드', '점퍼선 (수-수 / 암-수)'];
  p.comps.forEach(c => allParts.push(c.name + (c.sub ? ` (${c.sub})` : '')));
  const resCount = {};
  d.wires.forEach(w => { if (w.r) resCount[w.r] = (resCount[w.r] || 0) + 1; });
  if (p.comps.some(c => c.type === 'cds')) resCount['10kΩ'] = (resCount['10kΩ'] || 0) + 1;
  Object.entries(resCount).forEach(([v, n]) => allParts.push(`저항 ${v} × ${n}개`));

  return `
  <section class="hero">
    <div class="eyebrow">예시 ${String(idx).padStart(2, '0')} / 10</div>
    <h2>${esc(p.title)}</h2>
    <p class="pitch">${esc(p.pitch)}</p>
    <div class="meta">
      <span class="pill lv">난이도 <b>${stars(p.level)}</b></span>
      <span class="pill">예상 시간 <b>${p.time}</b></span>
      <span class="pill">입력 <b>${p.in.join(', ')}</b></span>
      <span class="pill">출력 <b>${p.out.join(', ')}</b></span>
    </div>
  </section>

  <div class="two">
    <div class="panel"><h3>준비물</h3><ul class="parts">${allParts.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="panel"><h3>어떻게 움직일까?</h3><ol class="steps">${p.how.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>
  </div>

  <section class="block">
    <div class="eyebrow">STEP 1</div>
    <h2>회로 연결도</h2>
    <p class="muted">아두이노의 노란 동그라미 핀만 사용해요. 화면이 좁으면 그림을 옆으로 밀어서 보세요.</p>

function bindProject(p) {
  const key = 'am-chk-' + p.id;
  let st = load(key, {});
  const boxes = [...view.querySelectorAll('table.wires input')];
  const prog = document.getElementById('prog');
  const refresh = () => {
    let done = 0;
    boxes.forEach((b, i) => { b.checked = !!st[i]; b.closest('tr').classList.toggle('done', b.checked); if (b.checked) done++; });
    prog.textContent = `${done} / ${boxes.length} 연결 완료`;
  };
  boxes.forEach((b, i) => b.addEventListener('change', () => { st[i] = b.checked; save(key, st); refresh(); }));
  document.getElementById('resetChk').addEventListener('click', () => { st = {}; save(key, st); refresh(); });
  refresh();

  const copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', () => {
    const ok = () => { copyBtn.textContent = '복사됨 ✓'; copyBtn.classList.add('ok'); setTimeout(() => { copyBtn.textContent = '코드 복사'; copyBtn.classList.remove('ok'); }, 1800); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(document.getElementById('codeBox'));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      copyBtn.textContent = 'Ctrl+C 로 복사하세요';
    };
    try { navigator.clipboard.writeText(p.code).then(ok, fallback); } catch (e) { fallback(); }
  });
  view.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
}

      ${both.length ? `<p class="muted" style="font-size:14px">이 조합이 그대로 들어 있는 예시</p><div class="refs">${refBtns(both)}</div>` : `
      <p class="muted" style="font-size:14px">입력 회로와 코드는 여기서 가져오고</p><div class="refs">${refBtns(inRef)}</div>
      <p class="muted" style="font-size:14px">출력 회로와 코드는 여기서 가져와 합쳐요</p><div class="refs">${refBtns(outRef)}</div>`}`;
    document.querySelectorAll('#mixResult [data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  };
  document.getElementById('mixIn').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { mixIn = b.dataset.v; draw(); } });
  document.getElementById('mixOut').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { mixOut = b.dataset.v; draw(); } });
  draw();
  view.querySelectorAll('.cards [data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
}

const start = (location.hash || '').slice(1) || load('am-tab', 'guide');
go(start, true);
</script>

</body>
</html>
